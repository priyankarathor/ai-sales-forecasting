[project]
name = "salesforcasting-ml"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.1",
    "pandas>=3.0.6",
    "pymongo>=4.18.3",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
    "scikit-learn>=1.9.1",
    "joblib>=1.6.0",
]

[project.optional-dependencies]
production-planning = [
    "scipy>=1.13.0",
    "matplotlib>=3.9.0",
]
monthly-forecast = [
    "prophet>=1.1.6",
    "xgboost>=2.1.0",
    "matplotlib>=3.9.0",
]
